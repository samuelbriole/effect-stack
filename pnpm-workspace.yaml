packages:
  - packages/*
  - packages/*/examples/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

# Foldkit 0.168.0 pins stable Effect/platform-browser 4.0.0 peers exactly.
# Allow only the workspace's 4.0.5 patch versions; published peers are unchanged.
peerDependencyRules:
  allowedVersions:
    "foldkit>effect": "4.0.5"
    "foldkit>@effect/platform-browser": "4.0.5"

allowBuilds:
  esbuild: false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  # Exact-version exceptions for newly released tooling and its platform binaries.
  - "@effect/tsgo@0.54.0"
  - "@effect/tsgo-darwin-arm64@0.54.0"
  - "@effect/tsgo-darwin-x64@0.54.0"
  - "@effect/tsgo-linux-arm@0.54.0"
  - "@effect/tsgo-linux-arm64@0.54.0"
  - "@effect/tsgo-linux-x64@0.54.0"
  - "@effect/tsgo-win32-arm64@0.54.0"
  - "@effect/tsgo-win32-x64@0.54.0"
  - oxfmt@0.74.0
  - "@oxfmt/binding-android-arm-eabi@0.74.0"
  - "@oxfmt/binding-android-arm64@0.74.0"
  - "@oxfmt/binding-darwin-arm64@0.74.0"
  - "@oxfmt/binding-darwin-x64@0.74.0"
  - "@oxfmt/binding-freebsd-x64@0.74.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.74.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.74.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.74.0"
  - "@oxfmt/binding-linux-arm64-musl@0.74.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.74.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.74.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.74.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.74.0"
  - "@oxfmt/binding-linux-x64-gnu@0.74.0"
  - "@oxfmt/binding-linux-x64-musl@0.74.0"
  - "@oxfmt/binding-openharmony-arm64@0.74.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.74.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.74.0"
  - "@oxfmt/binding-win32-x64-msvc@0.74.0"
