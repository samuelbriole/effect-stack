name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Prevent newer pushes from interrupting active release

jobs:
  release:
    if: github.repository_owner == 'samuelbriole'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@d0ee272882939fa35f22d979828acb7e61e0bd47 # v2.0.0-next.4
        with:
          version-script: pnpm changeset-version
          publish-script: pnpm changeset-publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check release pull request
        if: steps.changesets.outputs.has-changesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          for _ in {1..10}; do
            run_id=$(gh run list --workflow check.yml --event pull_request --limit 20 \
              --json databaseId,headSha \
              --jq "map(select(.headSha == \"$head_sha\"))[0].databaseId // empty")
            test -n "$run_id" && break
            sleep 2
          done
          test -n "${run_id:-}"
          gh run rerun "$run_id"
