name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Prevent newer pushes from interrupting active release

jobs:
  release:
    if: github.repository_owner == 'samuelbriole'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Ensure the dedicated token is always used when Changesets pushes
          # updates to the release branch, allowing its checks to run.
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@d0ee272882939fa35f22d979828acb7e61e0bd47 # v2.0.0-next.4
        with:
          version-script: pnpm changeset-version
          publish-script: pnpm changeset-publish
          # A dedicated token ensures release-branch updates trigger workflows.
          github-token: ${{ secrets.CHANGESET_GITHUB_TOKEN }}
